# Pre-commit hook config (native git workflow).
#
# Installed via `uv run pre-commit install` -> .git/hooks/pre-commit.
# Scoped to the text files we actually edit (Python, docs, shell, web UI):
# the C sources / model atmospheres / paper vendor files must NOT be
# reformatted (mixed line endings, vendor whitespace).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [python]
      - id: end-of-file-fixer
        types: [python]
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
